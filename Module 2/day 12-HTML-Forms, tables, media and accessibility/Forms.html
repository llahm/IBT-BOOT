<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="this is an index html file to demonstrate forms">
        <meta name="keywords" content="forms, html, input, textarea, select, button">
        <meta name="author" content="Samsung">
        <meta name="robots" content="index, follow">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Reservation</title>
    </head>
    <body>
        <h1>
            this is a page dedicated to practicing Forms
        </h1>
        <form action="">
            <fieldset>
                <legend>Product Details</legend>
                <label for="quantity">Quantity:</label>
                <input type="number" name="quantity" id="quantity" min="1" max="10">
                <br>
                <input type="radio" name="size" id="small" value="small">
                <label for="small">Small</label>
                <input type="radio" name="size" id="medium" value="medium">
                <label for="medium">Medium</label>
                <input type="radio" name="size" id="large" value="large">
                <label for="large">Large</label>

            </fieldset>
            

        </form>
            <br>
        <form class="order-info" action="" method="post">
            <input type="submit" value="Submit">
            <label for="reset">Reset:</label>
            <input id="reset" type="reset" for="quantity" value="Reset" title="Reset the form">
            <input type="button" value="Click Me" onclick="alert('Button clicked!')">
            <br>
            <label for="city">City:</label>
            <input type="city" id="city" name="city" placeholder="Enter your city">
            <br>
            <label for="regions">Region:</label>
            <select name="regions" id="regions" required>
                <option value="selection-none">Select a region</option>
                <option value="north">North</option>
                <option value="south">South</option>
                <option value="east">East</option>
                <option value="west">West</option>
            </select>
        </form>

        <!--a field-set to wrap all out form fields-->
        <fieldset >
            <legend>personal information</legend>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required >
        </fieldset>

        <form action="">
            <br>
            <label for="validid">SUBMIT YOUR ID AS A PDF HERE</label>
            <br>
            <input type="file" id="validid" name="file">
        </form>
        
    </body>
</html>
