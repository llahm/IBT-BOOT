<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styles demo</title>

    <!-- the below is an external style sheet link -->
    <link rel="stylesheet" href="styles.css">

    <!--internal styling is demonstrated below-->
    <style>
        body {
            background-color: #ad7b7b;
            font-family: Arial, sans-serif;

        }
        h1 {
            color: #315855;
        }
    </style>
</head>


<body>
    <!-- here we use inline styling to change the color of this text to red and the font size to 20px. -->
    <h1 style="color: red; font-size: 20px; border: 1px solid #315855;">Styles Demo</h1>
    <p>This is a simple demo of CSS styling.</p>

    <p>this is a paragraph with some <strong>bold</strong> text and some <em>italic</em> text.</p>
</body>
</html>
