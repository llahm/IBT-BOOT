<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 19 DOM Exercises</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 id="heading">Original Heading</h1>
    <button id="heading-btn">Change Heading</button>


    <hr>

    <h2>Exercise 2: Ethiopian Cities</h2>

    <ul id="city-list"></ul>


    <hr>

    <h2>Exercise 3: Event Bubbling</h2>

    <div id="button-wrapper">
        <button id="bubble-btn">
            Click Me and Check the Console
        </button>
    </div>


    <hr>

    <h2>Exercise 4: Delete Items</h2>

    <ul id="delete-list">
        <li>
            Coffee
            <button class="delete-btn">Delete</button>
        </li>

        <li>
            Injera
            <button class="delete-btn">Delete</button>
        </li>

        <li>
            Shiro
            <button class="delete-btn">Delete</button>
        </li>
    </ul>


    <hr>

    <h2>Exercise 5: Add Items Using a Form</h2>

    <form id="item-form">
        <input
            type="text"
            id="item-input"
            placeholder="Enter an item"
        >

        <button type="submit">Add Item</button>
    </form>

    <ul id="item-list"></ul>


    <script src="app.js"></script>
