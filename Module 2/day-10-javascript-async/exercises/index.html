<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 20 - Async JavaScript Exercises</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>
        <h1>Day 20 Async JavaScript Exercises</h1>

        <section>
            <h2>1. USD → ETB Exchange Rate</h2>
            <button id="rate-btn">Get USD to ETB Rate</button>
            <p id="rate-output"></p>
        </section>

        <section>
            <h2>2. Async/Await Fetch</h2>
            <button id="await-btn">Fetch Exchange Rate</button>
            <p id="await-output"></p>
        </section>

        <section>
            <h2>3. Error Handling</h2>
            <button id="wrong-url-btn">Test Wrong URL</button>
            <button id="not-found-btn">Test 404 URL</button>
            <p id="error-output"></p>
        </section>

        <section>
            <h2>4. Promise.all</h2>
            <button id="promise-btn">Fetch Exchange Rates</button>
            <div id="promise-output"></div>
        </section>

        <section>
            <h2>5. Loading / Success / Error States</h2>
            <button id="state-btn">Fetch Exchange Rate</button>
            <p id="state-output"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
