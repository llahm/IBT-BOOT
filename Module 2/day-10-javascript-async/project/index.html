<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Search for live country facts using the REST Countries API"
    >

    <title>Country Facts</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Country Facts</h1>
        <p>Search for a country and discover its basic facts.</p>
    </header>

    <main>
        <form id="search-form">
            <input
                type="text"
                id="country-input"
                value="Ethiopia"
                placeholder="Enter a country name"
            >

            <button type="submit">Search</button>
        </form>

        <section id="facts" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
