<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
        <title>Birr Watch</title>
    </head>
    <body>

        <div class="container">
            <h1>Birr Watch</h1>

            <p id="status">Loading rates…</p>
            
            <form id="convert-form">
                <label for="amount">please enter an amount greater than zero</label>
                <br>
                <input id="amount" type="number" value="100" />
                <br>
                
                <label for="currency">Currency</label>
                <br>
                <select id="currency">

                </select>
                

                <button>Convert</button>
            </form>
            <br>
            <p id="result"></p>
            <br>
            <h2>Watchlist</h2>
            <ul id="watchlist">
            </ul>
        </div>
    </body>

</html>

<script src="app.js"></script>
